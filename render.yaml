services:
  # ==========================================
  # 1. Backend Web Service (FastAPI / Python)
  # ==========================================
  - type: web
    name: eos-proteccion-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ==========================================
  # 2. Frontend Static Site (React / Vite)
  # ==========================================
  - type: web
    name: eos-proteccion-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://eos-proteccion-api.onrender.com
